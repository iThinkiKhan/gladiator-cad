; Temporary isolated build configuration for an S3 USB upload while another
; PlatformIO environment is building in .pio/build. It is not a new target.
[platformio]
default_envs = gladiator_s3
build_dir = .pio_upload_s3/build
libdeps_dir = .pio_upload_s3/libdeps

[env:gladiator_s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:tools/no_digest_image.py
build_src_filter = +<*> -<bench/>
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_port = COM25
upload_speed = 460800
monitor_port = COM25
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	adafruit/Adafruit BNO08x@1.2.5
	bblanchon/ArduinoJson@7.4.2
